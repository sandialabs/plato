stages: [setup, test]

include:
  local: ci/*-templates.yml

build-image:
  stage: setup
  extends: .build-image
  tags:
    - ${SYSTEM}
    - ${EXECUTOR}

merge-develop:
  stage: setup
  extends: .merge-with-develop
  tags:
    - ${SYSTEM}
    - ${EXECUTOR}
  needs: ["build-image"]

copy-paste-check-functional:
  variables:
    CHECK_DIR: "platoengine/functional/plato/"
    COPY_TOKENS: "70"
    EXCLUDE_LIST: ""
  stage: test
  extends: .run-copy-paste-check
  tags:
    - ${SYSTEM}
    - ${EXECUTOR}
  needs:
  - job: "merge-develop"
    optional: true
  - job: "build-image"
    optional: false

copy-paste-check-engine:
  variables:
    CHECK_DIR: "platoengine/base/src/"
    COPY_TOKENS: "700"
    EXCLUDE_LIST: "platoengine/base/src/iso/main/IsoVolumeExtractionTool.cpp"
  stage: test
  extends: .run-copy-paste-check
  tags:
    - ${SYSTEM}
    - ${EXECUTOR}
  needs:
  - job: "merge-develop"
    optional: true
  - job: "build-image"
    optional: false

copy-paste-check-analyze:
  variables:
    CHECK_DIR: "platoanalyze/"
    COPY_TOKENS: "1036"
    EXCLUDE_LIST: ""
  stage: test
  extends: .run-copy-paste-check
  tags:
    - ${SYSTEM}
    - ${EXECUTOR}
  needs:
  - job: "merge-develop"
    optional: true
  - job: "build-image"
    optional: false

doxygen-engine:
  stage: test
  extends: .run-doxygen
  tags:
    - ${SYSTEM}
    - ${EXECUTOR}
  needs:
    - job: "merge-develop"
      optional: true
    - job: "build-image"
      optional: false
