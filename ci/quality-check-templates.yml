include:
  local: ci/variables.yml

.run-copy-paste-check:
  before_script:
    - source utilities/system-env/${SYSTEM}.sh
    - source utilities/detail/merge-or-checkout.sh ${TRIGGER_BRANCH} ${TRIGGER_SOURCE}
  script:
    - echo "Copy paste check running on ${TRIGGER_BRANCH}"
    - source utilities/copy-paste-check.sh ${CPD_DIR} ${COPY_TOKENS}  ${CHECK_DIR} ${EXCLUDE_LIST}

