stages: [setup, build, test, teardown]

include:
  local: ci/*-templates.yml

build-image:
  stage: setup
  extends: .build-image
  tags:
    - ${SYSTEM}
    - ${EXECUTOR}

merge-develop:
  stage: setup
  extends: .merge-with-develop
  tags:
    - ${SYSTEM}
    - ${EXECUTOR}
  needs: ["build-image"]

setup-spack:
  stage: setup
  extends: .setup-local-spack-installation
  tags:
    - ${SYSTEM}
    - ${EXECUTOR}
  needs:
  - job: "merge-develop"
    optional: true
  - job: "build-image"
    optional: false

build-gcovr:
  stage: build
  extends: .install-gcovr
  tags:
    - ${SYSTEM}
    - ${EXECUTOR}
  needs: ["setup-spack"]

build-dependencies:
  stage: build
  extends: .build-and-cache-dependencies
  tags:
    - ${SYSTEM}
    - ${EXECUTOR}
  needs:
    - job: "setup-spack"
      optional: false
    - job: "build-gcovr"
      optional: true

build-platoengine:
  stage: build
  extends: .build-and-cache-engine
  tags:
    - ${SYSTEM}
    - ${EXECUTOR}
  needs: ["build-dependencies"]

build-app:
  stage: build
  extends: .build-and-cache-app
  tags:
    - ${SYSTEM}
    - ${EXECUTOR}
  variables:
    BUILD_TYPE: ${APPLICATION}
  needs: ["build-platoengine"]

unittest-platoengine:
  stage: test
  extends: .unittest-platoengine
  tags:
    - ${SYSTEM}
    - ${EXECUTOR}
  needs: ["build-app"]

unittest-coverage-platoengine:
  stage: test
  extends: .unittest-coverage-platoengine
  tags:
    - ${SYSTEM}
    - ${EXECUTOR}
  needs: ["build-platoengine"]

test-platoengine:
  stage: test
  extends: .test-platoengine
  tags:
    - ${SYSTEM}
    - ${EXECUTOR}
  needs: ["build-app"]

unittest-app:
  stage: test
  extends: .unittest-app
  tags:
    - ${SYSTEM}
    - ${EXECUTOR}
  variables:
    BUILD_TYPE: ${APPLICATION}
  needs: ["build-app"]

test-app:
  stage: test
  extends: .test-app
  tags:
    - ${SYSTEM}
    - ${EXECUTOR}
  variables:
    BUILD_TYPE: ${APPLICATION}
  needs: ["build-app"]

teardown:
  stage: teardown
  extends: .clean-build-caches
  tags:
    - ${SYSTEM}
    - ${EXECUTOR}
  needs:
    - job: "unittest-platoengine"
      optional: true
    - job: "unittest-app"
      optional: true
    - job: "test-platoengine"
      optional: true
    - job: "test-app"
      optional: true
    - job: "test-platoanalyze-timing"
      optional: true
