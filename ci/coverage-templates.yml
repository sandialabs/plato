include:
  local: ci/base.yml

.install-gcovr:
  extends: .base-job
  rules:
    - if: $RUN_COVERAGE_UNIT_TESTS == "true"
      when: on_success
    - when: never
  before_script:
    - source utilities/system-env/${SYSTEM}.sh
    - echo "Installing py-gcovr"
  script:
    - source utilities/build-env.sh
    - spack concretize -f
    - spack install py-gcovr
  cache:
    - key: ${SPACK_DEPENDENCY_KEY}_${CONFIGURATION}
      paths: 
        - spack/opt
      policy: pull-push
      when: always

# Template for running platoengine unit test executables with gcovr for coverage reporting.
.unittest-coverage-platoengine:
  extends: .base-job
  rules:
    - if: $RUN_COVERAGE_UNIT_TESTS == "true"
      when: on_success
    - when: never
  variables:
    COV_REPORT_DIR: "${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/coverage"
    COV_COBERTURA_PATH: "cobertura.xml"
  before_script:
    - source utilities/system-env/${SYSTEM}.sh
    - echo "Unit testing for coverage platoengine for branch ${TRIGGER_BRANCH} from source ${TRIGGER_SOURCE}"
    - mkdir -p ${COV_REPORT_DIR}
    - source utilities/detail/merge-or-checkout.sh ${TRIGGER_BRANCH} ${TRIGGER_SOURCE}
    - source utilities/test-env.sh ${APPLICATION}
  script:
    - spack build-env platoengine -- bash
    - BUILD_DIR=$(spack location -b platoengine)
    - cd ${BUILD_DIR}/functional/plato
    - ctest
    - cd ${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/
    - SOURCE_DIR=$(spack location -c platoengine)
    - spack load py-gcovr
    - |
      gcovr -j16 -r ${SOURCE_DIR} --cobertura ${COV_COBERTURA_PATH} \
            --html-details coverage.html --print-summary \
            --exclude-unreachable-branches \
            --exclude '.*unittest.*' \
            --exclude '.*test_utilities.*' \
            --exclude '.*integration_tests.*'
            ${BUILD_DIR}/functional/plato
  coverage: '/lines: ([0-9]{1,3}.[0-9]%)/'
  artifacts:
    when: always
    paths:
      - "${COV_REPORT_DIR}"
    reports:
      coverage_report:
        coverage_format: cobertura
        path: "${COV_REPORT_DIR}/${COV_COBERTURA_PATH}"
  cache:
    - key: ${BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - spack/opt
      untracked: true # For spack env files
      policy: pull
