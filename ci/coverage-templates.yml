include:
  local: ci/variables.yml

# Template for running platoengine unit test executables with kcov for coverage reporting. 
.unittest-coverage-platoengine:
  rules:
    - if: $RUN_COVERAGE_UNIT_TESTS == "true"
      when: on_success
    - when: never
  variables:
    KCOV_REPORT_DIR: "${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/merged-coverage"
    KCOV_REPORT_DIR_BASE: "${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/coverage"
    KCOV_EXCLUDE_PATTERNS: "/unittest/,/parallel_unittest/,/integration_tests/,/test_utilities/,/usr/include/,/usr/lib,googletest"
    KCOV_INCLUDE_PATTERNS: "platoengine/functional"
    KCOV_COBERTURA_PATH: "kcov-merged/cobertura.xml"
  before_script:
    - source utilities/system-env/${SYSTEM}.sh
    - echo "Unit testing for coverage platoengine for branch ${TRIGGER_BRANCH} from source ${TRIGGER_SOURCE}"
    - mkdir -p ${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/
    - source utilities/detail/merge-or-checkout.sh ${TRIGGER_BRANCH} ${TRIGGER_SOURCE}
    - source utilities/test-env.sh
  script:
    - PLATOENGINE_DIR=$(spack location -i platoengine)
    - UNIT_TESTERS=$(find "$PLATOENGINE_DIR"/bin -name "*UnitTest*" -printf "%f ")
    - |
      for TEST in ${UNIT_TESTERS}; do
        echo "Running ${TEST} for coverage"
        KCOV_REPORT_DIR_FOR_TEST=${KCOV_REPORT_DIR_BASE}_${TEST}
        mkdir -p ${KCOV_REPORT_DIR_FOR_TEST}
        ${KCOV_DIR}/./kcov --include-pattern=${KCOV_INCLUDE_PATTERNS} --exclude-pattern=${KCOV_EXCLUDE_PATTERNS} ${KCOV_REPORT_DIR_FOR_TEST} ${TEST}
      done
    - ALL_REPORT_DIRS=$(find ${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR} -maxdepth 1 -name "*UnitTest*")
    - ${KCOV_DIR}/./kcov --include-pattern=${KCOV_INCLUDE_PATTERNS} --merge ${KCOV_REPORT_DIR} ${ALL_REPORT_DIRS}
    - grep -oP 'coverage line-rate="[0-9].[0-9]*"' ${KCOV_REPORT_DIR}/${KCOV_COBERTURA_PATH} | grep -oP '[0-9].[0-9]*' > grepcov.txt
    - perl -e 'print '`cat grepcov.txt`'*100' > prcnt
    - echo 'Percentage Covered '`cat prcnt`
  coverage: '/Percentage Covered \d+\.\d+/'
  artifacts:
    when: always
    paths:
      - "${KCOV_REPORT_DIR}"
    reports:
      coverage_report:
        coverage_format: cobertura
        path: "${KCOV_REPORT_DIR}/${KCOV_COBERTURA_PATH}"
  cache:
    - key: ${BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - spack/opt
      untracked: true # For spack env files
      policy: pull
