include: 
  local: ci/variables.yml

# Template for building either platoengine or platoanalyze or their dependencies
# Expected variables:
#  BUILD_TYPE: Either dependencies, platoengine or platoanalyze
#  SPACK_INSTALL_ARGS: Additional install flags for `spack install`, likely just `--only dependencies` for PE
.build-and-cache:
  variables:
    BUILD_JOBS: "16"
  rules:
    - if: $CONFIGURATION == "gpu"
      variables:
        BUILD_JOBS: "8" # Reduce memory and disk usage for gpu builds
    - when: on_success
  before_script:
    - echo "Building ${BUILD_TYPE} for branch ${TRIGGER_BRANCH}"
    - echo "Pipeline source was ${TRIGGER_SOURCE}"
# For merge request pipelines, merge develop with the source branch,
# otherwise just checkout the branch.
    - |
      if [[ "$TRIGGER_SOURCE" == "merge_request_event" ]]
      then
        echo "Merging branch ${TRIGGER_BRANCH} with develop"
        source utilities/merge-with-develop.sh "$TRIGGER_BRANCH"
      else
        source utilities/checkout-branch.sh ${TRIGGER_BRANCH}
      fi
    - git submodule foreach git branch # Show branch in output
  script:
    - source utilities/build-env.sh
    - spack concretize -f
    - spack install ${SPACK_INSTALL_ARGS} -j ${BUILD_JOBS}
# Make sure package was installed, if not there was a build error
    - if [[ "$BUILD_TYPE" != "dependencies" ]]; then spack find "${BUILD_TYPE}"; fi
# Uninstall PE so it doesn't get copied to the spack/opt/spack cache.
    - if [[ "$BUILD_TYPE" == "dependencies" ]]; then spack uninstall -ayfR platoengine; fi
  artifacts:
    when: always
    untracked: true
    paths:
      - ${CI_PROJECT_DIR}/${BUILD_TYPE}/spack-build-out.txt

.build-and-cache-dependencies:
  timeout: 6 hours
  extends: .build-and-cache
  variables:
    BUILD_TYPE: dependencies
    SPACK_INSTALL_ARGS: "--only dependencies"
  cache:
    - key: ${SPACK_DEPENDENCY_KEY}_${CONFIGURATION}
      paths: 
        - spack/opt
      policy: pull-push
    - key: ${PE_BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - platoengine/spack-*
        - spack/opt
      policy: push

.build-and-cache-engine:
  extends: .build-and-cache
  variables:
    BUILD_TYPE: platoengine
    SPACK_INSTALL_ARGS: "--only dependencies"
  cache:
    - key: ${PE_BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - platoengine/spack-*
        - spack/opt
      policy: pull-push

.build-and-cache-analyze:
  timeout: 4 hours
  extends: .build-and-cache
  variables:
    BUILD_TYPE: platoanalyze
    SPACK_INSTALL_ARGS: ""
  cache:
    - key: ${PE_BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - platoengine/spack-*
        - platoanalyze/spack-*
        - spack/opt
      policy: pull-push
