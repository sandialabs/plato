include: 
  local: ci/variables.yml

# Template for building either platoengine or platoanalyze or their dependencies
# Expected variables:
#  BUILD_TYPE: Either dependencies, platoengine or platoanalyze
#  SPACK_INSTALL_ARGS: Additional install flags for `spack install`, likely just `--only dependencies` for PE
.build-and-cache:
  before_script:
    - source utilities/system-env/${SYSTEM}.sh
    - echo "Building ${BUILD_TYPE} for branch ${TRIGGER_BRANCH}"
    - echo "Pipeline source was ${TRIGGER_SOURCE}"
    - ./utilities/run-ssh-agent.sh
    - source utilities/detail/merge-or-checkout.sh ${TRIGGER_BRANCH} ${TRIGGER_SOURCE}
    - git submodule foreach git branch # Show branch in output
  script:
    - source utilities/build-env.sh
    - spack concretize -f
    - spack install ${SPACK_INSTALL_ARGS}
# Make sure package was installed, if not there was a build error
    - if [[ "$BUILD_TYPE" != "dependencies" ]]; then spack find "${BUILD_TYPE}"; fi
# Copy the build log to upload as an artifact
    - |
      if [[ "$BUILD_TYPE" == "dependencies" ]]
      then
        PE_LOCATION=$(spack location -s platoengine)
        mkdir "$BUILD_TYPE" && cp ${PE_LOCATION}/spack-build-out.txt "$BUILD_TYPE"
      else
        BUILD_LOCATION=$(spack location -s ${BUILD_TYPE})
        cp ${BUILD_LOCATION}/spack-build-out.txt "$BUILD_TYPE"
      fi
# Uninstall PE for the dependencies build so it doesn't get copied to the spack/opt/spack cache.
    - |
      if [[ "$BUILD_TYPE" == "dependencies" ]]
      then
        spack uninstall -ayfR platoengine
      fi
  artifacts:
    when: always
    paths:
      - ${CI_PROJECT_DIR}/${BUILD_TYPE}/spack-build-out.txt

.build-and-cache-dependencies:
  timeout: 6 hours
  extends: .build-and-cache
  variables:
    BUILD_TYPE: dependencies
    SPACK_INSTALL_ARGS: "--only dependencies"
  cache:
    - key: ${SPACK_DEPENDENCY_KEY}_${CONFIGURATION}
      paths: 
        - spack/opt
      policy: pull-push
      when: always
    - key: ${BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - build/platoengine/spack-*
        - spack/opt
      untracked: true # For spack env files
      policy: push

.build-and-cache-engine:
  extends: .build-and-cache
  variables:
    BUILD_TYPE: platoengine
    SPACK_INSTALL_ARGS: "--only dependencies"
  cache:
    - key: ${BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - build/platoengine/spack-*
        - spack/opt
      untracked: true # For spack env files
      policy: pull-push

.build-and-cache-app:
  timeout: 4 hours
  extends: .build-and-cache
  variables:
    SPACK_INSTALL_ARGS: ""
  cache:
    - key: ${BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - build/platoengine/spack-*
        - build/${BUILD_TYPE}/spack-*
        - spack/opt
      untracked: true # For spack env files
      policy: pull-push
