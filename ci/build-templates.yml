include: 
  local: ci/base.yml

# Template for building either platoengine or platoanalyze or their dependencies
# Expected variables:
#  BUILD_TYPE: Either dependencies, platoengine or platoanalyze
#  SPACK_INSTALL_ARGS: Additional install flags for `spack install`, likely just `--only dependencies` for PE
.build-and-cache:
  extends: .base-job
  before_script:
    - source utilities/system-env/${SYSTEM}.sh
    - echo "Building ${BUILD_TYPE} for branch ${TRIGGER_BRANCH}"
    - echo "Pipeline source was ${TRIGGER_SOURCE}"
    - ./utilities/run-ssh-agent.sh
    - source utilities/detail/merge-or-checkout.sh ${TRIGGER_BRANCH} ${TRIGGER_SOURCE}
    - git submodule foreach git branch # Show branch in output
    - |
      if [[ -v CUSTOM_CLONE_SCRIPT && "${BUILD_TYPE}" == "dependencies" ]]; then
        source ${CUSTOM_CLONE_SCRIPT}
      fi
  script:
    - ${RUN_IN_PODMAN} ./ci/scripts/build.sh
    - ${RUN_IN_PODMAN} ./ci/scripts/check-installation.sh
  artifacts:
    when: always
    paths:
      - ${CI_PROJECT_DIR}/${BUILD_TYPE}/spack-build-out.txt

.build-and-cache-dependencies:
  timeout: 6 hours
  extends: .build-and-cache
  variables:
    BUILD_TYPE: dependencies
    SPACK_INSTALL_ARGS: "--only dependencies -p 4"
  cache:
    - key: ${SPACK_DEPENDENCY_KEY}_${CONFIGURATION}
      paths: 
        - spack/opt
      policy: pull-push
      when: always
    - key: ${BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - spack/opt
      untracked: true # For spack env files
      policy: push

.build-and-cache-engine:
  extends: .build-and-cache
  variables:
    BUILD_TYPE: platoengine
    SPACK_INSTALL_ARGS: "-p 4 platoengine"
  cache:
    - key: ${BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - build/platoengine
        - spack/opt
      untracked: true # For spack env files
      policy: pull-push

.build-and-cache-app:
  timeout: 4 hours
  extends: .build-and-cache
  variables:
    SPACK_INSTALL_ARGS: "-p 4"
  cache:
    - key: ${BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - build/platoengine
        - build/${BUILD_TYPE}
        - spack/opt
      untracked: true # For spack env files
      policy: pull-push
