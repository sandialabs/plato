include: 
  local: ci/variables.yml

# Template for building either platoengine or platoanalyze or their dependencies
# Expected variables:
#  BUILD_TYPE: Either dependencies, platoengine or platoanalyze
#  SPACK_INSTALL_ARGS: Additional install flags for `spack install`, likely just `--only dependencies` for PE
.build-and-cache:
  variables:
    BUILD_JOBS: "16"
  rules:
    - if: $CONFIGURATION == "gpu"
      variables:
        BUILD_JOBS: "8" # Reduce memory and disk usage for gpu builds
    - when: on_success
  before_script:
    - echo "Building ${BUILD_TYPE} for branch ${TRIGGER_BRANCH}"
    - echo "Pipeline source was ${TRIGGER_SOURCE}"
# For merge request pipelines, merge develop with the source branch,
# otherwise just checkout the branch.
    - |
      if [[ "$TRIGGER_SOURCE" == "merge_request_event" ]]
      then
        echo "Merging branch ${TRIGGER_BRANCH} with develop"
        source utilities/merge-with-develop.sh "$TRIGGER_BRANCH"
      else
        source utilities/checkout-branch.sh ${TRIGGER_BRANCH}
      fi
    - git submodule foreach git branch # Show branch in output
  script:
    - source utilities/build-env.sh
    - spack concretize -f
    - spack install ${SPACK_INSTALL_ARGS} -j ${BUILD_JOBS}
# Make sure package was installed, if not there was a build error
    - if [[ "$BUILD_TYPE" != "dependencies" ]]; then spack find "${BUILD_TYPE}"; fi
# Uninstall PE so it doesn't get copied to the spack/opt/spack cache.
    - if [[ "$BUILD_TYPE" == "dependencies" ]]; then spack uninstall -ayfR platoengine; fi
  artifacts:
    when: always
    untracked: true
    paths:
      - ${CI_PROJECT_DIR}/${BUILD_TYPE}/spack-build-out.txt

.build-and-cache-dependencies:
  timeout: 6 hours
  extends: .build-and-cache
  variables:
    BUILD_TYPE: dependencies
    SPACK_INSTALL_ARGS: "--only dependencies"
  cache:
    - key: ${SPACK_DEPENDENCY_KEY}_${CONFIGURATION}
      paths: 
        - spack/opt
      policy: pull-push
    - key: ${PE_BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - platoengine/spack-*
        - spack/opt
      policy: push

.build-and-cache-engine:
  extends: .build-and-cache
  variables:
    BUILD_TYPE: platoengine
    SPACK_INSTALL_ARGS: "--only dependencies"
  cache:
    - key: ${PE_BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - platoengine/spack-*
        - spack/opt
      policy: pull-push

.build-and-cache-analyze:
  timeout: 4 hours
  extends: .build-and-cache
  variables:
    BUILD_TYPE: platoanalyze
    SPACK_INSTALL_ARGS: ""
  cache:
    - key: ${PE_BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - platoengine/spack-*
        - platoanalyze/spack-*
        - spack/opt
      policy: pull-push

# Template for generating unit test jobs for a dynamic child pipeline.
# This searches the PE installation path for executables with `UnitTest`
# in their name and creates a matrix job to run them.
.generate-platoengine-unittests:
  variables:
    CHILD_PIPELINE_TEMPLATE: ci/detail/unittest-child-pipeline.yml.in 
    CHILD_PIPELINE_FILE: unittest-pipeline.yml
  before_script:
    - echo "Unit testing platoengine for branch ${TRIGGER_BRANCH}"
    - source utilities/test-env.sh || true 
  script:
    - PLATOENGINE_DIR=$(spack location -i platoengine)
    - UNIT_TESTERS=$(find "$PLATOENGINE_DIR"/bin -name "*UnitTest*" -printf "%f, ")
    - UNIT_TESTERS="${UNIT_TESTERS::-2}"
    - UNIT_TESTERS_FOR_KCOV=$(echo $UNIT_TESTERS | sed 's/,//g')
    - COVERAGE_BASE_DIRS=$(find platoengine/base/src/* -maxdepth 0 -type d -printf "%f, ")
    - COVERAGE_APPS_DIRS=$(find platoengine/apps/* -maxdepth 0 -type d -printf "%f, ")
    - COVERAGE_DIRS="${COVERAGE_BASE_DIRS}${COVERAGE_APPS_DIRS::-2}"
    - cp ${CHILD_PIPELINE_TEMPLATE} ${CHILD_PIPELINE_FILE}
    - sed -i "s/UNIT_TESTER_TOKEN/${UNIT_TESTERS}/" ${CHILD_PIPELINE_FILE}
    - sed -i "s/UNIT_TESTER_FOR_KCOV_TOKEN/${UNIT_TESTERS_FOR_KCOV}/" ${CHILD_PIPELINE_FILE}
    - sed -i "s/COVERAGE_DIRS_TOKEN/${COVERAGE_DIRS}/" ${CHILD_PIPELINE_FILE}
  artifacts:
    paths:
      - ${CHILD_PIPELINE_FILE}
  cache:
    - key: ${PE_BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - platoengine/spack-*
        - spack/opt
      policy: pull
