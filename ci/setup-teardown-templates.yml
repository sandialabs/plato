include: 
  local: ci/base.yml

# Builds an Ubuntu-based image with gcc and clang
.build-image:
  extends: .base-job
  script:
    - podman login $CI_REGISTRY --username $CI_REGISTRY_USER --password $CI_REGISTRY_PASSWORD
    - podman pull $CI_TOOLCHAIN_IMAGE || echo "Rebuilding image"
    - podman build --format docker --tag $CI_TOOLCHAIN_IMAGE -f ci/podman/Dockerfile .
    - podman push $CI_TOOLCHAIN_IMAGE

# Merges TRIGGER_BRANCH with develop for merge request pipelines.
# This has to be repeated in other jobs, but this job exists so that if the merge fails,
# it's clear that it failed due to merge conflicts.
.merge-with-develop:
  extends: .base-job
  rules:
    - if: $TRIGGER_SOURCE == "merge_request_event"
  before_script:
    - source utilities/system-env/${SYSTEM}.sh 
  script:
    - echo "Merging branch ${TRIGGER_BRANCH} with develop"
    - source utilities/merge-with-develop.sh $TRIGGER_BRANCH

# Creates a new spack environment for CONFIGURATION.
# CONFIGURATION must match a supported spec file in utilities/spack.
.setup-local-spack-installation:
  extends: .base-job
  rules:
    - if: $CUSTOM_SETUP_SCRIPT != null
      variables:
        SETUP_SCRIPT: $CUSTOM_SETUP_SCRIPT
    - if: $CUSTOM_SETUP_SCRIPT == null
      variables:
        SETUP_SCRIPT: $DEFAULT_SETUP_SCRIPT
  before_script:
    - source utilities/system-env/${SYSTEM}.sh ${CONFIGURATION}
    - echo "Setting up spack"
    - echo "Trigger branch is ${TRIGGER_BRANCH}"
    - echo "Trigger source is ${TRIGGER_SOURCE}"
    - echo "Setup Script is ${SETUP_SCRIPT}"
    - source utilities/detail/merge-or-checkout.sh ${TRIGGER_BRANCH} ${TRIGGER_SOURCE}
    - git submodule foreach git branch # Show branch in output
  script:
    - ${RUN_IN_PODMAN} ./ci/scripts/setup-spack.sh
  artifacts:
    when: always
    untracked: true # For spack env files
    paths: 
      - spack.yaml

# Deletes all temporary build caches, i.e. PE and PA build objects.
# The cache containing all dependencies is persistent.
.clean-build-caches:
  extends: .base-job
  when: always
  before_script:
    - source utilities/system-env/${SYSTEM}.sh ${CONFIGURATION}
    - echo "Runner home is ${RUNNER_HOME}"
  script:
    - rm -rf ${RUNNER_HOME}/cache/${CI_PROJECT_PATH}/${BUILD_CACHE_KEY}_${CI_PIPELINE_ID}-*
