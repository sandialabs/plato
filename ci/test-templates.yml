include: 
  local: ci/variables.yml

# Template for running platoengine unit test executables. This also
# runs kcov to generate coverage reports for the debug build.
# Expected variables:
#  PLATO_ENGINE_UNIT_TESTER: The name of the unit test executable
.unittest-platoengine:
  variables:
    GTEST_REPORT_FILE: "${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/${PLATO_ENGINE_UNIT_TESTER}.xml"
    KCOV_REPORT_DIR: "${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/coverage_${PLATO_ENGINE_UNIT_TESTER}"
    KCOV_EXCLUDE_PATTERNS: "_UnitTester.cpp,/usr/include/,/usr/lib,googletest,/unittest/"
  before_script:
    - echo "Unit testing platoengine for branch ${TRIGGER_BRANCH}"
    - echo "Using cache with key ${CACHE_KEY}"
    - mkdir -p ${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/
    - source utilities/detail/merge-or-checkout.sh ${TRIGGER_BRANCH} ${TRIGGER_SOURCE}
    - source utilities/test-env.sh
  script:
    - |
      if [ ${CONFIGURATION} == "cpu-debug" ]
      then
        mkdir -p ${KCOV_REPORT_DIR}
        ${KCOV_DIR}/./kcov --include-pattern=platoengine --exclude-pattern=${KCOV_EXCLUDE_PATTERNS} ${KCOV_REPORT_DIR} ${PLATO_ENGINE_UNIT_TESTER} --gtest_output=xml:${GTEST_REPORT_FILE}
      else
        ${PLATO_ENGINE_UNIT_TESTER} --gtest_output=xml:${GTEST_REPORT_FILE}
      fi
  artifacts:
    when: always
    paths:
      - "${GTEST_REPORT_FILE}"
      - "${KCOV_REPORT_DIR}"
    reports:
      junit: 
        - "${GTEST_REPORT_FILE}"
  cache:
    - key: ${CACHE_KEY}
      paths:
        - platoengine/spack-*
        - spack/opt
      untracked: true # For spack env files
      policy: pull

# Template for running platoanalyze unit test executables. 
.unittest-platoanalyze:
  rules:
    - if: $CONFIGURATION == "dakota"
      when: never
    - when: on_success
  variables:
    CTEST_REPORT_FILE: "platoanalyze_unittests.xml"
    PA_UNIT_TEST_DIR: "unit_tests"
    CTEST_LOG: "Testing/Temporary/LastTest.log"
  before_script:
    - echo "Unit testing platoengine for branch ${TRIGGER_BRANCH}"
    - mkdir -p ${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/
    - source utilities/detail/merge-or-checkout.sh ${TRIGGER_BRANCH} ${TRIGGER_SOURCE}
    - source utilities/test-env.sh
  script: 
    - BUILD_DIR=$(spack location -b platoanalyze)
    - cd ${BUILD_DIR}/${PA_UNIT_TEST_DIR}
    - ctest -R UnitTest --output-junit ${CTEST_REPORT_FILE} || TEST_FAILED=true
    - cp ${CTEST_REPORT_FILE} ${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/
    - cp ${CTEST_LOG} ${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/ 
    - if [[ "${TEST_FAILED}" == "true" ]]; then (exit 1); fi # Fail if ctest failed
  artifacts:
    when: always
    paths:
      - "${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}"
    reports:
      junit: 
        - "${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/${CTEST_REPORT_FILE}"
  cache:
    - key: ${BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - platoengine/spack-*
        - platoanalyze/spack-*
        - spack/opt
      untracked: true # For spack env files
      policy: pull

# Template for running platoengine or platoanalyze regression/integration tests.
# This does not run for the cpu-debug configuration.
# Expected variables:
#  PLATO_NAME: Either platoengine or platoanalyze
.test-plato:
  timeout: 6 hours
  variables:
    GTEST_REPORT_NAME: "${PLATO_NAME}-tests.xml"
    CTEST_LOG: "Testing/Temporary/LastTest.log"
    TIMEOUT_IN_SEC: "3600"
    PA_TIMING_SCALE: "2.0"
    CTEST_EXCLUDE_REGEX: "timing|UnitTest"
    CTEST_LABEL_EXCLUDE: "GPU_only"
    CTEST_NUM_JOBS: "4"
    CTEST_INCLUDE_REGEX: ".*"
  rules:
    - if: $CONFIGURATION == "gpu"
      variables:
        CTEST_EXCLUDE_REGEX: "UnitTest"
        CTEST_LABEL_EXCLUDE: ""
        CTEST_NUM_JOBS: "1"
    - if: $CONFIGURATION == "dakota"
      variables:
        CTEST_INCLUDE_REGEX: "dakota"
    - if: $CONFIGURATION == "cpu-debug"
      when: never
    - when: on_success
  before_script:
    - echo "Testing ${PLATO_NAME} for branch ${TRIGGER_BRANCH}"
    - mkdir -p ${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/
    - export PA_TIMING_SCALE=${PA_TIMING_SCALE}
    - export OPTIMISM_DIR=${OPTIMISM_DIR}
    - export PATH=${CUBIT_DIR}:${SIERRA_DIR}:$PATH
    - source utilities/detail/merge-or-checkout.sh ${TRIGGER_BRANCH} ${TRIGGER_SOURCE}
    - source utilities/test-env.sh
  script:
    - BUILD_DIR=$(spack location -b ${PLATO_NAME})
    - cd ${BUILD_DIR}
    - ctest -R "${CTEST_INCLUDE_REGEX}" -E "${CTEST_EXCLUDE_REGEX}" -LE "${LABEL_EXCLUDE}" --timeout "${TIMEOUT_IN_SEC}" -j"${CTEST_NUM_JOBS}" --output-junit ${GTEST_REPORT_NAME} || TEST_FAILED=true
    - cp ${GTEST_REPORT_NAME} ${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/
    - cp ${CTEST_LOG} ${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/ 
    - if [[ "${TEST_FAILED}" == "true" ]]; then (exit 1); fi # Fail if ctest failed
  artifacts:
    when: always
    paths:
      - "${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}"
    reports:
      junit: 
        - "${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/${GTEST_REPORT_NAME}"
  cache:
    - key: ${BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - platoengine/spack-*
        - platoanalyze/spack-*
        - spack/opt
      untracked: true # For spack env files
      policy: pull

.test-platoengine:
  extends: .test-plato
  variables:
    PLATO_NAME: platoengine

.test-platoanalyze:
  extends: .test-plato
  variables:
    PLATO_NAME: platoanalyze
