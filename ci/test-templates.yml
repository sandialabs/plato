include: 
  local: ci/variables.yml

# Template for running platoengine unit test executables. This also
# runs kcov to generate coverage reports for the debug build.
# Expected variables:
#  PLATO_ENGINE_UNIT_TESTER: The name of the unit test executable
.unittest-platoengine:
  variables:
    GTEST_REPORT_FILE: "${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/${PLATO_ENGINE_UNIT_TESTER}.xml"
    KCOV_REPORT_DIR: "${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/coverage_${PLATO_ENGINE_UNIT_TESTER}"
    KCOV_EXCLUDE_PATTERNS: "_UnitTester.cpp,/usr/include/,/usr/lib,googletest,/unittest/"
  before_script:
    - echo "Unit testing platoengine for branch ${TRIGGER_BRANCH}"
    - mkdir -p ${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/
    - source utilities/build-env.sh
    - spack install --only dependencies # Reinstall from build cache
  script:
    - source utilities/test-env.sh || true 
    - |
      if [ ${CONFIGURATION} == "cpu-debug" ]
      then
        mkdir -p ${KCOV_REPORT_DIR}
        ${KCOV_DIR}/./kcov --include-pattern=platoengine --exclude-pattern=${KCOV_EXCLUDE_PATTERNS} ${KCOV_REPORT_DIR} ${PLATO_ENGINE_UNIT_TESTER} --gtest_output=xml:${GTEST_REPORT_FILE}
      else
        ${PLATO_ENGINE_UNIT_TESTER} --gtest_output=xml:${GTEST_REPORT_FILE}
      fi
  artifacts:
    when: always
    paths:
      - "${GTEST_REPORT_FILE}"
      - "${KCOV_REPORT_DIR}"
    reports:
      junit: 
        - "${GTEST_REPORT_FILE}"
  cache:
    - key: ${SPACK_DEPENDENCY_KEY}_${CONFIGURATION}
      paths:
        - spack/opt
      policy: pull
    - key: ${PE_BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - platoengine/spack-*
      untracked: true
      policy: pull

# Template for running platoanalyze unit test executables. 
.unittest-platoanalyze:
  variables:
    GTEST_REPORT_FILE: "platoanalyze_unittests.xml"
    PA_UNIT_TEST_DIR: "unit_tests"
    CTEST_LOG: "Testing/Temporary/LastTest.log"
  before_script:
    - echo "Unit testing platoengine for branch ${TRIGGER_BRANCH}"
    - mkdir -p ${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/
    - source utilities/build-env.sh
    - spack install # Reinstall from build cache
  script: 
    - source utilities/test-env.sh || true 
    - BUILD_DIR=$(spack location -b platoanalyze)
    - cd ${BUILD_DIR}/${PA_UNIT_TEST_DIR}
    - ctest -R UnitTest --output-junit ${GTEST_REPORT_FILE} || TEST_FAILURE=true
    - cp ${GTEST_REPORT_FILE} ${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/
    - cp ${CTEST_LOG} ${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/ 
    - if [[ "${TEST_FAILURE}" == "true" ]]; then (exit 1); fi # Fail if ctest failed
  artifacts:
    when: always
    paths:
      - "${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}"
    reports:
      junit: 
        - "${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/${GTEST_REPORT_FILE}"
  cache:
    - key: ${SPACK_DEPENDENCY_KEY}_${CONFIGURATION}
      paths:
        - spack/opt
      policy: pull
    - key: ${PE_BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - platoengine/spack-*
      policy: pull
    - key: ${PA_BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - platoanalyze/spack-*
      untracked: true
      policy: pull

# Template for running platoengine or platoanalyze regression/integration tests.
# This does not run for the cpu-debug configuration.
# Expected variables:
#  PLATO_NAME: Either platoengine or platoanalyze
#  SPACK_INSTALL_ARGS: Additional install flags for `spack install`, likely just `--only dependencies` for PE
.test-plato:
  timeout: 6 hours
  variables:
    GTEST_REPORT_NAME: "${PLATO_NAME}-tests.xml"
    CTEST_LOG: "Testing/Temporary/LastTest.log"
    TIMEOUT_IN_SEC: "3600"
    PA_TIMING_SCALE: "2.0"
    CTEST_EXCLUDE_REGEX: "timing|UnitTest"
    CTEST_LABEL_EXCLUDE: "GPU_only"
    CTEST_NUM_JOBS: "4"
  rules:
    - if: $CONFIGURATION == "gpu"
      variables:
        CTEST_EXCLUDE_REGEX: "UnitTest"
        CTEST_LABEL_EXCLUDE: ""
        CTEST_NUM_JOBS: "1"
    - if: $CONFIGURATION == "cpu-debug"
      when: never
    - when: on_success
  before_script:
    - echo "Testing ${PLATO_NAME} for branch ${TRIGGER_BRANCH}"
    - mkdir -p ${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/
    - source utilities/build-env.sh
    - spack install ${SPACK_INSTALL_ARGS} # Reinstall from build cache
    - export PA_TIMING_SCALE=${PA_TIMING_SCALE}
    - export OPTIMISM_DIR=${OPTIMISM_DIR}
    - export PATH=${CUBIT_DIR}:${SIERRA_DIR}:$PATH
  script:
    - source utilities/test-env.sh || true
    - BUILD_DIR=$(spack location -b ${PLATO_NAME})
    - cd ${BUILD_DIR}
    - ctest -E "${CTEST_EXCLUDE_REGEX}" -LE "${LABEL_EXCLUDE}" --timeout "${TIMEOUT_IN_SEC}" -j"${CTEST_NUM_JOBS}" --output-junit ${GTEST_REPORT_NAME} || TEST_FAILURE=true
    - cp ${GTEST_REPORT_NAME} ${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/
    - cp ${CTEST_LOG} ${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/ 
    - if [[ "${TEST_FAILURE}" == "true" ]]; then (exit 1); fi # Fail if ctest failed
  artifacts:
    when: always
    paths:
      - "${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}"
    reports:
      junit: 
        - "${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/${GTEST_REPORT_NAME}"
  cache:
    - key: ${SPACK_DEPENDENCY_KEY}_${CONFIGURATION}
      paths:
        - spack/opt
      policy: pull
    - key: ${PE_BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - platoengine/spack-*
      untracked: true
      policy: pull

.test-platoengine:
  extends: .test-plato
  variables:
    PLATO_NAME: platoengine
    SPACK_INSTALL_ARGS: "--only dependencies"

.test-platoanalyze:
  extends: .test-plato
  variables:
    PLATO_NAME: platoanalyze
    SPACK_INSTALL_ARGS: ""
  cache:
    - key: ${SPACK_DEPENDENCY_KEY}_${CONFIGURATION}
      paths:
        - spack/opt
      policy: pull
    - key: ${PE_BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - platoengine/spack-*
      policy: pull
    - key: ${PA_BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - platoanalyze/spack-*
      untracked: true
      policy: pull
