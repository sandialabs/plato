include: 
  local: ci/variables.yml

.unittest-plato:
  rules:
    - if: $SKIP_PE_UNIT_TESTS == "true" && $PLATO_NAME == "platoengine"
      when: never
    - if: $SKIP_APP_UNIT_TESTS == "true" && $PLATO_NAME == $BUILD_TYPE
      when: never
    - when: on_success
  variables:
    CTEST_REPORT_FILE: "${PLATO_NAME}_All_UnitTester.xml"
    CTEST_LOG: "Testing/Temporary/LastTest.log"
  before_script:
    - source utilities/system-env/${SYSTEM}.sh
    - echo "Unit testing ${PLATO_NAME} for branch ${TRIGGER_BRANCH}"
    - mkdir -p ${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/
    - source utilities/detail/merge-or-checkout.sh ${TRIGGER_BRANCH} ${TRIGGER_SOURCE}
    - source utilities/test-env.sh
    - source utilities/sanitizer-env.sh ${CI_PROJECT_DIR}/${LSAN_BLACKLIST_FILE}
  script: 
    - BUILD_DIR=$(spack location -b ${PLATO_NAME})
    - cd ${BUILD_DIR}
    - ctest -R UnitTest --output-junit ${CTEST_REPORT_FILE} || TEST_FAILED=true
    - find . -name "*UnitTester.xml" -exec cp "{}" ${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/ \;
    - cp ${CTEST_LOG} ${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/ 
    - if [[ "${TEST_FAILED}" == "true" ]]; then (exit 1); fi # Fail if ctest failed
  artifacts:
    when: always
    paths:
      - "${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}"
    reports:
      junit: 
        - "${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/*_UnitTester.xml"
  cache:
    - key: ${BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - platoengine/spack-*
        - platoanalyze/spack-*
        - spack/opt
      untracked: true # For spack env files
      policy: pull

.unittest-platoengine:
  extends: .unittest-plato
  variables:
    PLATO_NAME: platoengine

.unittest-platoanalyze:
  extends: .unittest-plato
  variables:
    PLATO_NAME: platoanalyze

# Template for running platoengine or platoanalyze regression/integration tests.
# This does not run for the cpu-debug configuration.
# Expected variables:
#  PLATO_NAME: Either platoengine or platoanalyze
.test-plato:
  timeout: 6 hours
  variables:
    GTEST_REPORT_NAME: "${PLATO_NAME}-tests.xml"
    CTEST_LOG: "Testing/Temporary/LastTest.log"
    TIMEOUT_IN_SEC: "3600"
    PA_TIMING_SCALE: "2.0"
    CTEST_EXCLUDE_REGEX: "timing|UnitTest"
    CTEST_LABEL_EXCLUDE: "GPU_only"
    CTEST_NUM_JOBS: "16"
    CTEST_INCLUDE_REGEX: ".*"
  rules:
    - if: $SKIP_PE_REGRESSION_TESTS == "true" && $PLATO_NAME == "platoengine"
      when: never
    - if: $SKIP_APP_REGRESSION_TESTS == "true" && $PLATO_NAME == $BUILD_TYPE
      when: never
    - if: $CONFIGURATION == "gpu"
      variables:
        CTEST_LABEL_EXCLUDE: ""
        CTEST_NUM_JOBS: "1"
    - when: on_success
  before_script:
    - source utilities/system-env/${SYSTEM}.sh
    - echo "Testing ${PLATO_NAME} for branch ${TRIGGER_BRANCH}"
    - mkdir -p ${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/
    - export PA_TIMING_SCALE=${PA_TIMING_SCALE}
    - export PATH=${CUBIT_DIR}:$PATH
    - source utilities/detail/merge-or-checkout.sh ${TRIGGER_BRANCH} ${TRIGGER_SOURCE}
    - source utilities/test-env.sh || true
  script:
    - BUILD_DIR=$(spack location -b ${PLATO_NAME})
    - cd ${BUILD_DIR}
    - echo "Test Labels "
    - echo "CTest Include Regex ${CTEST_INCLUDE_REGEX}"
    - echo "CTest Exclude Regex ${CTEST_EXCLUDE_REGEX}"
    - echo "Label Exclude ${LABEL_EXCLUDE}"
    - ctest -R "${CTEST_INCLUDE_REGEX}" -E "${CTEST_EXCLUDE_REGEX}" -LE "${LABEL_EXCLUDE}" --timeout "${TIMEOUT_IN_SEC}" -j"${CTEST_NUM_JOBS}" --output-junit ${GTEST_REPORT_NAME} || TEST_FAILED=true
    - cp ${GTEST_REPORT_NAME} ${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/
    - cp ${CTEST_LOG} ${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/ 
    - if [[ "${TEST_FAILED}" == "true" ]]; then (exit 1); fi # Fail if ctest failed
  artifacts:
    when: always
    paths:
      - "${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}"
    reports:
      junit: 
        - "${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/${GTEST_REPORT_NAME}"
  cache:
    - key: ${BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - platoengine/spack-*
        - platoanalyze/spack-*
        - spack/opt
      untracked: true # For spack env files
      policy: pull

.test-platoengine:
  extends: .test-plato
  variables:
    PLATO_NAME: platoengine

.test-platoanalyze:
  extends: .test-plato
  variables:
    PLATO_NAME: platoanalyze

.test-platoanalyze-timing:
  extends: .test-plato
  allow_failure: true
  variables:
    PLATO_NAME: platoanalyze
  rules:
    - if: $CONFIGURATION == "gpu"
      variables:
        CTEST_EXCLUDE_REGEX: "UnitTest"
        CTEST_INCLUDE_REGEX: "timing"
        CTEST_LABEL_EXCLUDE: ""
        CTEST_NUM_JOBS: "1"
      when: on_success
    - when: never
 
