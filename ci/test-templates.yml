include: 
  local: ci/base.yml

.unittest-plato:
  extends: .base-job
  rules:
    - if: $SKIP_PE_UNIT_TESTS == "true" && $PLATO_NAME == "platoengine"
      when: never
    - if: $SKIP_APP_UNIT_TESTS == "true" && $PLATO_NAME == $BUILD_TYPE
      when: never
    - when: on_success
  variables:
    CTEST_REPORT_FILE: "${PLATO_NAME}_All_UnitTester.xml"
    CTEST_LOG: "Testing/Temporary/LastTest.log"
  before_script:
    - source utilities/system-env/${SYSTEM}.sh
    - echo "Unit testing ${PLATO_NAME} for branch ${TRIGGER_BRANCH}"
    - mkdir -p ${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/
    - source utilities/detail/merge-or-checkout.sh ${TRIGGER_BRANCH} ${TRIGGER_SOURCE}
  script:
    - ${RUN_IN_PODMAN} ./ci/scripts/unittest-plato.sh
  artifacts:
    when: always
    paths:
      - "${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}"
    reports:
      junit: 
        - "${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/*_UnitTester.xml"
  cache:
    - key: ${BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - platoengine/spack-*
        - platoanalyze/spack-*
        - spack/opt
      untracked: true # For spack env files
      policy: pull

.unittest-platoengine:
  extends: .unittest-plato
  variables:
    PLATO_NAME: platoengine

.unittest-app:
  extends: .unittest-plato
  variables:
    PLATO_NAME: ${APPLICATION}

# Template for running platoengine or platoanalyze regression/integration tests.
# This does not run for the cpu-debug configuration.
# Expected variables:
#  PLATO_NAME: Either platoengine or APPLICATION
.test-plato:
  extends: .base-job
  timeout: 6 hours
  variables:
    GTEST_REPORT_NAME: "${PLATO_NAME}-tests.xml"
    CTEST_LOG: "Testing/Temporary/LastTest.log"
    TIMEOUT_IN_SEC: "3600"
    PA_TIMING_SCALE: "2.0"
    CTEST_EXCLUDE_REGEX: "timing|UnitTest"
    CTEST_LABEL_EXCLUDE: "GPU_only"
    CTEST_NUM_JOBS: "16"
    CTEST_INCLUDE_REGEX: ".*"
  rules:
    - if: $SKIP_PE_REGRESSION_TESTS == "true" && $PLATO_NAME == "platoengine"
      when: never
    - if: $SKIP_APP_REGRESSION_TESTS == "true" && $PLATO_NAME == $BUILD_TYPE
      when: never
    - if: $CONFIGURATION == "gpu"
      variables:
        CTEST_LABEL_EXCLUDE: "CPU_only"
        CTEST_NUM_JOBS: "2"
    - when: on_success
  before_script:
    - source utilities/system-env/${SYSTEM}.sh
    - echo "Testing ${PLATO_NAME} for branch ${TRIGGER_BRANCH}"
    - mkdir -p ${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/
    - export PA_TIMING_SCALE=${PA_TIMING_SCALE}
    - source utilities/detail/merge-or-checkout.sh ${TRIGGER_BRANCH} ${TRIGGER_SOURCE}
  script:
    - export OMPI_ALLOW_RUN_AS_ROOT=1
    - export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
    - ${RUN_IN_PODMAN} ./ci/scripts/test-plato.sh
  artifacts:
    when: always
    paths:
      - "${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}"
    reports:
      junit: 
        - "${CI_PROJECT_DIR}/${REPORTS_ARTIFACTS_DIR}/${GTEST_REPORT_NAME}"
  cache:
    - key: ${BUILD_CACHE_KEY}_${CI_PIPELINE_ID}
      paths:
        - platoengine/spack-*
        - platoanalyze/spack-*
        - spack/opt
      untracked: true # For spack env files
      policy: pull

.test-platoengine:
  extends: .test-plato
  variables:
    PLATO_NAME: platoengine

.test-app:
  extends: .test-plato
  variables:
    PLATO_NAME: ${APPLICATION}
